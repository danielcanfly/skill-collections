name: job_scoring
version: 1.0.0
status: draft
owner: Daniel
description: Score jobs that are already stored in the system, including backfilling unscored rows or re-scoring a targeted stored job.
entrypoint_type: skill
public: true

intent_signals:
  - score unscored jobs
  - backfill scores
  - rescore stored jobs
  - score only
  - 把沒打分的都打分
  - 補打分
  - 未打分
  - 重打分

allowed_task_types:
  - bulk_score_new_jobs

allowed_backend_tools:
  - v2_tool_bulk_score_new_jobs

required_context:
  - request_id
  - session_id
  - trace_id

input_schema:
  type: object
  properties:
    target_job_id:
      type: string
      nullable: true
    force_rescore:
      type: boolean
      default: false

execution_policy:
  mode: deterministic
  sequence:
    - call: v2_tool_bulk_score_new_jobs

output_contract:
  summary_fields:
    - scored_count
    - primary_job_id
    - target_job_id
    - jobs
  include_primary_job_id: true

guardrails:
  - Do not fetch recent jobs in this skill.
  - Do not claim a fetch or refresh happened in this path.
  - If target_job_id is absent and force_rescore is false, this path should behave like score-unscored-only.
  - Treat missing request context as a hard failure.
  - Keep backend secrets out of the skill layer.

fallbacks:
  - if_zero_jobs_scored:
      behavior: complete_with_note
  - if_target_job_missing:
      behavior: complete_with_note
  - if_invalid_context:
      behavior: fail
