name: Materialize Universal Research OS upload

on:
  push:
    branches:
      - upload/universal-research-os-v1.0.1
    paths:
      - .github/urs-upload/_READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact public release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/universal-research-os.zip 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-aa68-820b-8e9d-daa6ad7ebdca/raw?se=2026-09-21T09%3A21%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=7b72a325-8336-575a-9d9e-7cfbd37d798d&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T02%3A09%3A18Z&ske=2026-09-22T02%3A09%3A18Z&sks=b&skv=2026-02-06&sig=kpwod9/dgDHVB3mb1axATmpoUDrXi3AFfsp3GgXuyT8%3D'
          echo "83d98b48570a4b7732c490d4fdc6740f941bb36b642d0dca1f1f275ac04c08ae  /tmp/universal-research-os.zip" | sha256sum -c -

      - name: Materialize and verify skill tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/urs-release skills/universal-research-os
          mkdir -p /tmp/urs-release skills/universal-research-os
          unzip -q /tmp/universal-research-os.zip -d /tmp/urs-release
          src="/tmp/urs-release/UNIVERSAL_RESEARCH_OS_SKILL_v1.0.1_PUBLIC_RELEASE"
          test -d "$src"
          cp -a "$src"/. skills/universal-research-os/
          python skills/universal-research-os/scripts/verify_skill_package.py

      - name: Update repository index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text()
          row = "| [Universal Research OS](skills/universal-research-os/) | Public Release | Apache-2.0 | Proof-carrying research orchestration and independent audit system for source-first construction, admission, bounded repair, global reconciliation, and production release. |"
          if row not in text:
              anchor = "| [Blog Production Workflow](skills/blog-production-workflow/) | Public Beta | Apache-2.0 | Profile-driven 11+1 editorial workflow with setup contracts, research/drafting/repair/visual/release stages, hardened handoff validation, and independent qualification. |"
              if anchor not in text:
                  raise SystemExit("README skill-table anchor not found")
              text = text.replace(anchor, anchor + "\n" + row)
              p.write_text(text)
          PY

      - name: Remove staging transport and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/urs-upload
          rm -f .github/workflows/urs-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add universal research os skill"
          git push origin HEAD:upload/universal-research-os-v1.0.1
